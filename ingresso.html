<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seu ingresso · Instituto Inova</title>
<meta name="theme-color" content="#014a43">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23014a43'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' font-weight='700' fill='%23d9b46a' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--verde:#014a43;--verde-2:#02635a;--ouro:#d9b46a;--creme:#f7f4ee;--tinta:#14211f;--muted:#5e6f6c;--linha:#dfe6e4;--ok:#13795b;--ok-claro:#e3f5ec;--amarelo:#a15c07;--amarelo-claro:#fff4e0;--vermelho:#b42318;--vermelho-claro:#fdecea}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--verde);color:var(--tinta);min-height:100vh;min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
  .ticket{width:100%;max-width:400px;background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.28);overflow:hidden}
  .topo{background:linear-gradient(160deg,var(--verde-2),var(--verde));color:#fff;padding:22px 22px 26px;text-align:center}
  .logo{width:64px;height:64px;border-radius:16px;background:#fff center/86% no-repeat;margin:0 auto 10px;object-fit:contain;display:block}
  .inst{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ouro);font-weight:700}
  .evento{font-family:"Playfair Display",Georgia,serif;font-size:28px;line-height:1.15;margin:6px 0 10px}
  .quando{font-size:14px;opacity:.92;line-height:1.5}
  .corte{position:relative;height:0;border-top:2px dashed var(--linha);margin:0 18px}
  .corte::before,.corte::after{content:"";position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--verde)}
  .corte::before{left:-32px}.corte::after{right:-32px}
  .corpo{padding:22px 22px 24px;text-align:center}
  .rot{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .nome{font-size:21px;font-weight:700;margin:4px 0 18px;overflow-wrap:anywhere}
  .qr{width:min(240px,72vw);margin:0 auto;padding:12px;border:1px solid var(--linha);border-radius:16px;background:#fff}
  .qr svg{display:block;width:100%;height:auto}
  .qr.apagado{opacity:.25}
  .cod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:20px;font-weight:700;letter-spacing:.12em;margin:12px 0 14px;color:var(--verde)}
  .status{display:inline-block;padding:8px 14px;border-radius:99px;font-weight:700;font-size:14px}
  .status.ok{background:var(--ok-claro);color:var(--ok)}
  .status.pendente{background:var(--amarelo-claro);color:var(--amarelo)}
  .status.usado,.status.cancelado{background:var(--vermelho-claro);color:var(--vermelho)}
  .dica{font-size:13px;color:var(--muted);margin:16px 0 0;line-height:1.5}
  .msg{background:#fff;border-radius:18px;padding:28px 22px;text-align:center;max-width:400px;width:100%}
  .msg h1{font-family:"Playfair Display",Georgia,serif;color:var(--verde);font-size:24px;margin:0 0 8px}
  .msg p{color:var(--muted);margin:0}
</style>
</head>
<body>
<main id="ing" class="msg"><p>Carregando seu ingresso…</p></main>
<script src="/config.js"></script>
<script src="/vendor/qrcode.js"></script>
<script type="module" src="/ingresso-pagina.js"></script>
</body>
</html>
