<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão Educacional · Instituto Inova</title>
<meta name="theme-color" content="#014a43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestão Educacional">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23014a43'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' font-weight='700' fill='%23d9b46a' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mobile.css">
<link rel="stylesheet" href="ingresso.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/logo-inova.png">
</head>
<body>
<div id="login" class="login hidden">
  <div class="login-card">
    <div class="login-logo" id="loginLogo"></div>
    <h1>Gestão Educacional</h1>
    <p class="muted">Instituto Inova</p>
    <form id="loginForm">
      <label>E-mail<input type="email" name="email" required autocomplete="username"></label>
      <label>Senha<input type="password" name="senha" required minlength="6" autocomplete="current-password"></label>
      <button class="btn primary full" type="submit">Entrar</button>
      <button class="btn ghost full" type="button" id="btnCriarAcesso">Primeiro acesso? Criar senha</button>
      <p class="login-msg" id="loginMsg"></p>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo" id="brandLogo"></div>
      <div>
        <div class="brand-title">Gestão Educacional</div>
        <div class="brand-sub" id="brandSub">Instituto Inova</div>
      </div>
    </div>
    <div class="top-actions">
      <span class="pill" id="modoDados" title="Onde os dados estão salvos"></span>
      <button class="btn small ghost-light" id="btnSair" title="Sair">Sair</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#painel" data-tab="painel">Painel</a>
    <a href="#cursos" data-tab="cursos">Cursos</a>
    <a href="#comercial" data-tab="comercial">Comercial</a>
    <a href="#alunos" data-tab="alunos">Alunos</a>
    <a href="#financeiro" data-tab="financeiro">Financeiro</a>
    <a href="#cobrancas" data-tab="cobrancas">Cobranças</a>
    <a href="#entrada" data-tab="entrada">Entrada</a>
    <a href="#retornos" data-tab="retornos">Retornos</a>
    <a href="#relatorios" data-tab="relatorios">Relatórios</a>
    <a href="#config" data-tab="config">Config.</a>
  </nav>
  <main id="view" class="view"><p class="muted center">Carregando…</p></main>
  <footer class="footer">Instituto Inova · Gestão Educacional</footer>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-head"><h2 id="modalTitle"></h2><button class="x" id="modalClose" aria-label="Fechar">×</button></div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script src="config.js"></script>
<script src="app.js" type="module"></script>
<script src="relatorios.js" type="module"></script>
<script src="ingresso.js" type="module"></script>
<script src="mobile.js" type="module"></script>
</body>
</html>
